<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocab 10K</title>
<style>
:root{color-scheme:light dark;--bg:#0d1117;--card:#161b22;--text:#f0f6fc;--muted:#8b949e;--line:#30363d;--accent:#2f81f7;--good:#238636;--warn:#9e6a03}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:760px;margin:auto;padding:16px 14px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:20px;margin:0}.counter{font-size:13px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:24px 18px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center}.badge{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}.word{font-size:clamp(38px,10vw,70px);font-weight:800;line-height:1.06;overflow-wrap:anywhere}.meta{min-height:72px;margin-top:18px;color:var(--muted);font-size:15px;line-height:1.45}.translation,.example{margin-top:9px;color:var(--text)}.example{font-style:italic;font-size:14px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}button{min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;padding:10px}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}button.on{outline:2px solid var(--accent);border-color:var(--accent)}button.good{background:var(--good);border-color:var(--good);color:#fff}button.warn{background:var(--warn);border-color:var(--warn);color:#fff}.row{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1 1 120px}.status{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 2px;min-height:20px}.progress{height:5px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:var(--accent)}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.4}@media(max-width:480px){.controls{grid-template-columns:repeat(2,1fr)}.card{min-height:280px;padding:20px 14px}}
</style>
</head>
<body>
<main class="app"><div class="top"><h1>Vocab 10K</h1><div id="counter" class="counter">Preparing…</div></div><div class="progress"><div id="bar" class="bar"></div></div><section class="card" aria-live="polite"><div id="badge" class="badge">Loading vocabulary</div><div id="word" class="word">…</div><div id="meta" class="meta">Preparing 10,000 cards.</div></section><div class="controls"><button id="prev" type="button">← Previous</button><button id="speak" type="button">🔊 Speak</button><button id="next" class="primary" type="button">Next →</button><button id="auto" type="button">▶ Auto</button></div><div class="row"><button id="shuffle" type="button">🔀 Shuffle OFF</button><button id="tr" type="button">🇹🇷 Turkish</button><button id="learning" class="warn" type="button">Learning</button><button id="known" class="good" type="button">Known</button></div><div id="status" class="status">British English · male voice preferred</div><div class="small">Pronunciation finishes → 0.5 s → next card. Only the word/phrasal verb is spoken.</div></main>
<script>
(()=>{'use strict';
const SOURCE='20k.txt';
const PHRASALS=["ask around","ask out","back away","back down","back off","back up","blow away","blow up","break down","break in","break into","break out","break up","bring about","bring along","bring back","bring down","bring in","bring out","bring up","brush up on","bump into","burn down","burn out","call back","call off","call on","call up","calm down","carry on","carry out","catch on","catch up","catch up with","check in","check out","cheer up","chip in","clean up","clear up","close down","come across","come along","come back","come down","come from","come in","come off","come on","come out","come over","come up","come up with","count on","cut back","cut down","cut off","cut out","deal with","do away with","do over","do without","dress up","drop by","drop off","drop out","eat out","end up","fall apart","fall behind","fall down","fall for","fall out","figure out","fill in","fill out","fill up","find out","fit in","focus on","get across","get along","get along with","get around","get away","get away with","get back","get by","get down","get in","get into","get off","get on","get on with","get out","get over","get rid of","get through","get together","get up","give away","give back","give in","give out","give up","go after","go against","go ahead","go away","go back","go by","go down","go for","go off","go on","go out","go over","go through","go up","grow apart","grow up","hand in","hand out","hang around","hang on","hang out","hang up","head for","hold back","hold on","hold up","keep away","keep on","keep up","keep up with","kick off","knock down","knock out","leave out","let down","let in","let off","let out","line up","live on","look after","look around","look back","look down on","look for","look forward to","look into","look out","look over","look up","look up to","make out","make up","make up for","move in","move on","move out","pass away","pass on","pass out","pay back","pay off","pick out","pick up","point out","pull off","pull over","put away","put back","put down","put off","put on","put out","put together","put up","put up with","read over","run across","run away","run into","run out","run out of","set off","set out","set up","settle down","show off","show up","shut down","sit down","sort out","speak up","stand by","stand for","stand out","stand up","start out","stay up","step down","step in","step up","stick to","sum up","switch off","switch on","take after","take apart","take away","take back","take down","take in","take off","take on","take out","take over","take up","talk over","tear down","think over","throw away","throw out","try on","try out","turn around","turn back","turn down","turn into","turn off","turn on","turn out","turn over","turn up","use up","wake up","walk away","warm up","watch out","wear out","work on","work out","write down","act on","add up","answer back","be into","be over","break away","break through","bring forward","call for","call in","care for","carry over","come about","come apart","come around","come by","come through","cut in","cut up","draw up","face up to","fall back on","follow up","get ahead","get at","get behind","get down to","get through to","give off","go along with","go without","hold onto","keep back","keep down","keep from","keep off","keep out","lay off","look ahead","look away","look through","make for","make of","move up","opt out","own up","phase out","put aside","put forward","put through","reach out","rule out","see off","see through"];
const TARGET_WORDS=9700,TARGET_TOTAL=10000,AFTER_SPEECH_MS=500,CACHE='vocab10k-cards-v4';
const BASIC=new Set(`a an the of to in on at by for from with and or but as if so than that this these those i me my mine we us our ours you your yours he him his she her hers it its they them their theirs who whom whose what which where when why how is am are was were be been being do does did have has had having can could may might must shall should will would not no yes very more most much many some any all each every both either neither one two first second other another same own such only just also even still already too again here there then now up down out off over under into onto upon about before after during while since until through without within between among against per via`.split(/\s+/));
const NOISE=new Set(`www com net org html http https php pdf jpg jpeg png gif mp3 mp4 online website site page pages click download login password copyright privacy terms search links link url email fax rss ebay yahoo google amazon microsoft sony nokia cnet xxx porn nude sexy anal pussy rape incest phentermine casino poker viagra god john david james michael george mary robert thomas paul martin william peter san texas california florida ohio virginia chicago york london washington jan feb mar apr jun jul aug sep oct nov dec january february march april may june july august september october november december mon tue wed thu fri sat sun monday tuesday wednesday thursday friday saturday sunday ii iii usr gmt pst id isbn xml usb dvd cd tv pc hp ltd inc co de la al ca pa tx az fl ny uk usa eur`.split(/\s+/));
const BAD_RE=/[^a-z'-]/;let cards=[],order=[],pos=0,autoplay=false,shuffled=false,autoToken=0,nativeReq=0;const nativeDone=new Map();const $=id=>document.getElementById(id),wordEl=$('word'),badge=$('badge'),meta=$('meta'),counter=$('counter'),bar=$('bar'),status=$('status');
function cleanWords(text){const seen=new Set(),out=[];for(const raw of text.split(/\r?\n/)){const w=raw.trim().toLowerCase();if(!w||w.length<3||w.length>18||BAD_RE.test(w)||w.includes("'")||BASIC.has(w)||NOISE.has(w))continue;if(!seen.has(w)){seen.add(w);out.push(w)}if(out.length===TARGET_WORDS)break}if(out.length!==TARGET_WORDS)throw new Error('Could only build '+out.length+' useful words.');return out}
function buildCards(words){const a=words.map((w,i)=>({text:w,type:'word',rank:i+1}));PHRASALS.forEach((p,i)=>a.push({text:p,type:'phrasal verb',rank:i+1}));if(a.length!==TARGET_TOTAL)throw new Error('Card count is '+a.length+', expected 10000.');return a}
function loadState(){try{return JSON.parse(localStorage.getItem('vocab10k-state')||'{}')}catch{return {}}}function saveState(extra={}){const old=loadState();localStorage.setItem('vocab10k-state',JSON.stringify({...old,...extra,pos,shuffled}))}
async function prepare(){try{const cached=localStorage.getItem(CACHE);if(cached){const c=JSON.parse(cached);if(Array.isArray(c)&&c.length===TARGET_TOTAL)cards=c}if(!cards.length){status.textContent='Preparing 9,700 useful words + 300 phrasal verbs…';const r=await fetch(SOURCE);if(!r.ok)throw new Error('Vocabulary data unavailable');cards=buildCards(cleanWords(await r.text()));localStorage.setItem(CACHE,JSON.stringify(cards))}order=Array.from({length:cards.length},(_,i)=>i);const st=loadState();pos=Math.min(Math.max(Number(st.pos)||0,0),order.length-1);shuffled=!!st.shuffled;if(shuffled)shuffleOrder(false);render();status.textContent='10,000 cards ready · British English · male preferred'}catch(e){wordEl.textContent='Data error';badge.textContent='Vocabulary';meta.textContent='The 10,000-card set could not be prepared.';status.textContent=e.message}}
function current(){return cards[order[pos]]}function render(){if(!cards.length)return;const c=current();wordEl.textContent=c.text;badge.textContent=c.type;counter.textContent=(pos+1).toLocaleString()+' / 10,000';bar.style.width=((pos+1)/100)+'%';const saved=loadState(),mark=(saved.marks||{})[c.text];meta.innerHTML=(mark?'<strong>'+mark+'</strong> · ':'')+(c.type==='phrasal verb'?'Top 300 practical phrasal verb':'Useful vocabulary');$('shuffle').textContent=shuffled?'🔀 Shuffle ON':'🔀 Shuffle OFF';$('shuffle').classList.toggle('on',shuffled);$('auto').textContent=autoplay?'⏸ Pause':'▶ Auto';$('auto').classList.toggle('on',autoplay)}
function move(delta,speak=true){if(!cards.length)return;pos=(pos+delta+order.length)%order.length;saveState();render();if(speak)speakText(current().text)}
function speakText(text){return new Promise(resolve=>{if(window.AndroidTTS&&typeof window.AndroidTTS.speak==='function'){for(const [k,r] of nativeDone){nativeDone.delete(k);r()}const id=++nativeReq;nativeDone.set(id,resolve);window.AndroidTTS.speak(text,id);return}resolve()})}window.__ttsDone=id=>{const r=nativeDone.get(Number(id));if(r){nativeDone.delete(Number(id));r()}};
async function autoLoop(token){while(autoplay&&token===autoToken){await speakText(current().text);if(!autoplay||token!==autoToken)break;await new Promise(r=>setTimeout(r,AFTER_SPEECH_MS));if(!autoplay||token!==autoToken)break;pos=(pos+1)%order.length;saveState();render()}}
function toggleAuto(){autoplay=!autoplay;autoToken++;render();if(autoplay)autoLoop(autoToken);else if(window.AndroidTTS&&window.AndroidTTS.stop)window.AndroidTTS.stop()}
function shuffleOrder(keepCurrent=true){const currentIndex=cards.length?order[pos]:0;for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=keepCurrent?Math.max(0,order.indexOf(currentIndex)):0}function toggleShuffle(){shuffled=!shuffled;if(shuffled)shuffleOrder(true);else{const idx=order[pos];order=Array.from({length:cards.length},(_,i)=>i);pos=idx}saveState();render()}
function mark(label){const s=loadState(),marks=s.marks||{};marks[current().text]=label;saveState({marks});move(1,true)}
async function showTurkish(){const c=current(),key='tr:'+c.text;let tr=localStorage.getItem(key);if(tr){meta.innerHTML+='<div class="translation">🇹🇷 '+tr+'</div>';return}try{status.textContent='Getting Turkish meaning…';const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(c.text)+'&langpair=en|tr';const r=await fetch(url),data=await r.json();tr=(data.responseData&&data.responseData.translatedText)||'';if(!tr)throw new Error();localStorage.setItem(key,tr);render();meta.innerHTML+='<div class="translation">🇹🇷 '+tr+'</div>';status.textContent='Meaning cached for offline use'}catch{status.textContent='Turkish meaning needs internet the first time.'}}
$('prev').addEventListener('click',()=>move(-1,true));$('next').addEventListener('click',()=>move(1,true));$('speak').addEventListener('click',()=>speakText(current().text));$('auto').addEventListener('click',toggleAuto);$('shuffle').addEventListener('click',toggleShuffle);$('tr').addEventListener('click',showTurkish);$('learning').addEventListener('click',()=>mark('Learning'));$('known').addEventListener('click',()=>mark('Known'));prepare();
})();
</script>
</body></html>
