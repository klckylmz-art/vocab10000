name: Build Sentence Study APK

on:
  push:
    branches:
      - build-sentence-study-apk-20260924
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Sentence Study project
        run: |
          rm -rf sentence-study-apk
          mkdir sentence-study-apk
          tar -xJf sentence-study-project-latest.tar.xz -C sentence-study-apk
      - name: Build debug APK
        working-directory: sentence-study-apk
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload Sentence Study APK
        uses: actions/upload-artifact@v4
        with:
          name: SentenceStudyAPK
          path: sentence-study-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
