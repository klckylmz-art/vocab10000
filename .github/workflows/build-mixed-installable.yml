name: Build Mixed Installable APK

on:
  push:
    branches: [ sentence-app-apk ]
    paths:
      - 'apk_src/**'
      - 'mixed_html/**'
      - '.github/workflows/build-mixed-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete Android shell
        run: |
          cat apk_src/chunk*.txt > /tmp/base-project.b64
          base64 -d /tmp/base-project.b64 > /tmp/base-project.tar.xz
          mkdir -p /tmp/base-unpack
          tar -xJf /tmp/base-project.tar.xz -C /tmp/base-unpack
          ROOT=$(find /tmp/base-unpack -name settings.gradle -printf '%h\n' | head -1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/java/net/ytutor/sentenceapp/MainActivity.java"
          test -f "$ROOT/app/src/main/java/net/ytutor/sentenceapp/PlaybackService.java"

      - name: Restore complete mixed HTML
        run: |
          cat mixed_html/chunk*.txt > /tmp/mixed-html.b64
          base64 -d /tmp/mixed-html.b64 > /tmp/mixed-html.xz
          xz -dc /tmp/mixed-html.xz > "$ROOT/app/src/main/assets/index.html"
          test -s "$ROOT/app/src/main/assets/index.html"
          grep -q '</html>' "$ROOT/app/src/main/assets/index.html"
          grep -q 'navigateSentence' "$ROOT/app/src/main/assets/index.html"
          grep -q "$('next').onclick=()=>navigateSentence(1, true);" "$ROOT/app/src/main/assets/index.html"
          grep -q "$('prev').onclick=()=>navigateSentence(-1, true);" "$ROOT/app/src/main/assets/index.html"

      - name: Make package independently installable
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'net.ytutor.sentenceapp.mixedinstall7'", s, count=1)
          s=re.sub(r'versionCode\s+\d+', 'versionCode 7', s, count=1)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '7.0'", s, count=1)
          g.write_text(s,encoding='utf-8')
          assert "applicationId 'net.ytutor.sentenceapp.mixedinstall7'" in s
          PY

      - name: Verify JavaScript
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          h=(Path(os.environ['ROOT'])/'app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          if not scripts: raise SystemExit('No inline JS found')
          for i,code in enumerate(scripts): Path(f'/tmp/mixed-{i}.js').write_text(code,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/mixed-*.js; do node --check "$f"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK with Android Gradle Plugin signing
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CumleCalisma-Mixed-Installable-v7
          path: ${{ env.APK }}
          if-no-files-found: error
