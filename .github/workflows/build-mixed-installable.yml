name: Build Mixed Installable APK

on:
  push:
    branches: [ sentence-app-apk ]
    paths:
      - 'apk2_src/**'
      - '.github/workflows/build-mixed-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore mixed Android project
        run: |
          cat apk2_src/chunk*.txt > /tmp/mixed-project.b64
          base64 -d /tmp/mixed-project.b64 > /tmp/mixed-project.tar.xz
          mkdir -p /tmp/mixed-unpack
          tar -xJf /tmp/mixed-project.tar.xz -C /tmp/mixed-unpack || true
          ROOT=$(find /tmp/mixed-unpack -name settings.gradle -printf '%h\n' | head -1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/assets/index.html"
          test -f "$ROOT/app/src/main/java/net/ytutor/sentenceapp/MainActivity.java"
          test -f "$ROOT/app/src/main/java/net/ytutor/sentenceapp/PlaybackService.java"

      - name: Make package independently installable and fix navigation
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'net.ytutor.sentenceapp.mixed2'", s, count=1)
          s=re.sub(r'versionCode\s+\d+', 'versionCode 2', s, count=1)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '2.0'", s, count=1)
          g.write_text(s,encoding='utf-8')

          p=root/'app/src/main/assets/index.html'
          h=p.read_text(encoding='utf-8')
          old='''function nextSentence(manual=true){\n  speechSynthesis.cancel();\n  orderPos=(orderPos+1)%ACTIVE_DATA.length;\n  syncIndex();\n  render();\n  if(isPlaying && manual) playCurrent();\n}\nfunction prevSentence(){\n  speechSynthesis.cancel();\n  orderPos=(orderPos-1+ACTIVE_DATA.length)%ACTIVE_DATA.length;\n  syncIndex();\n  render();\n  if(isPlaying) playCurrent();\n}'''
          new='''function navigateSentence(delta, restartPlayback=false){\n  const wasPlaying=isPlaying;\n  isPlaying=false;\n  try{ speechSynthesis.cancel(); }catch(e){}\n  const len=order.length || ACTIVE_DATA.length;\n  orderPos=(orderPos+delta+len)%len;\n  syncIndex();\n  render();\n  if(wasPlaying && restartPlayback){\n    setTimeout(()=>{ if(!isPlaying) playCurrent(); },120);\n  }\n}\nfunction nextSentence(manual=true){ navigateSentence(1, manual); }\nfunction prevSentence(){ navigateSentence(-1, true); }'''
          if 'function navigateSentence(delta' not in h and old in h:
              h=h.replace(old,new,1)
          h=h.replace("$('prev').onclick=prevSentence;", "$('prev').onclick=()=>navigateSentence(-1, true);", 1)
          h=h.replace("$('next').onclick=()=>nextSentence(false);", "$('next').onclick=()=>navigateSentence(1, true);", 1)
          h=h.replace("if(e.key==='ArrowRight') nextSentence(false);", "if(e.key==='ArrowRight') navigateSentence(1, true);", 1)
          h=h.replace("if(e.key==='ArrowLeft') prevSentence();", "if(e.key==='ArrowLeft') navigateSentence(-1, true);", 1)
          p.write_text(h,encoding='utf-8')
          assert "applicationId 'net.ytutor.sentenceapp.mixed2'" in s
          assert 'function navigateSentence(delta' in h
          assert "$('next').onclick=()=>navigateSentence(1, true);" in h
          print('package and navigation verified')
          PY

      - name: Verify JavaScript
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          h=(Path(os.environ['ROOT'])/'app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          for i,code in enumerate(scripts): Path(f'/tmp/mixed-{i}.js').write_text(code,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/mixed-*.js; do node --check "$f"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Android Gradle Plugin signing
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CumleCalisma-Mixed-Installable-v3
          path: ${{ env.APK }}
          if-no-files-found: error
