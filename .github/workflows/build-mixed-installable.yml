name: Build Mixed Installable APK

on:
  push:
    branches: [ sentence-app-apk ]
    paths:
      - 'apk_src/**'
      - 'apk2_src/**'
      - '.github/workflows/build-mixed-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete Android shell
        run: |
          cat apk_src/chunk*.txt > /tmp/base-project.b64
          base64 -d /tmp/base-project.b64 > /tmp/base-project.tar.xz
          mkdir -p /tmp/base-unpack
          tar -xJf /tmp/base-project.tar.xz -C /tmp/base-unpack
          ROOT=$(find /tmp/base-unpack -name settings.gradle -printf '%h\n' | head -1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/java/net/ytutor/sentenceapp/MainActivity.java"
          test -f "$ROOT/app/src/main/java/net/ytutor/sentenceapp/PlaybackService.java"

      - name: Recover mixed HTML from partial archive
        run: |
          cat apk2_src/chunk*.txt > /tmp/mixed-project.b64
          base64 -d /tmp/mixed-project.b64 > /tmp/mixed-project.tar.xz
          mkdir -p /tmp/mixed-unpack
          tar -xJf /tmp/mixed-project.tar.xz -C /tmp/mixed-unpack || true
          MIXED_ROOT=$(find /tmp/mixed-unpack -name settings.gradle -printf '%h\n' | head -1)
          test -n "$MIXED_ROOT"
          test -f "$MIXED_ROOT/app/src/main/assets/index.html"
          cp "$MIXED_ROOT/app/src/main/assets/index.html" "$ROOT/app/src/main/assets/index.html"
          test -s "$ROOT/app/src/main/assets/index.html"

      - name: Make package independently installable and override navigation
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          g=root/'app/build.gradle'
          s=g.read_text(encoding='utf-8')
          s=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'net.ytutor.sentenceapp.mixed5'", s, count=1)
          s=re.sub(r'versionCode\s+\d+', 'versionCode 5', s, count=1)
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '5.0'", s, count=1)
          g.write_text(s,encoding='utf-8')

          p=root/'app/src/main/assets/index.html'
          h=p.read_text(encoding='utf-8')
          override=r'''<script>
(function(){
  function fixedNavigate(delta){
    const wasPlaying=!!isPlaying;
    isPlaying=false;
    try{ speechSynthesis.cancel(); }catch(e){}
    const len=(order && order.length) ? order.length : ACTIVE_DATA.length;
    orderPos=(orderPos+delta+len)%len;
    syncIndex();
    render();
    if(wasPlaying){ setTimeout(()=>playCurrent(),120); }
  }
  const prevBtn=document.getElementById('prev');
  const nextBtn=document.getElementById('next');
  if(prevBtn) prevBtn.onclick=function(){ fixedNavigate(-1); };
  if(nextBtn) nextBtn.onclick=function(){ fixedNavigate(1); };
  window.__fixedMixedNavigate=fixedNavigate;
})();
</script>'''
          if 'window.__fixedMixedNavigate' not in h:
              h=h.replace('</body>',override+'\n</body>',1)
          p.write_text(h,encoding='utf-8')
          assert "applicationId 'net.ytutor.sentenceapp.mixed5'" in s
          assert 'window.__fixedMixedNavigate' in h
          assert 'Konu 2' in h
          print('package and navigation override verified')
          PY

      - name: Verify JavaScript
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          h=(Path(os.environ['ROOT'])/'app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          if not scripts: raise SystemExit('No inline JS')
          for i,code in enumerate(scripts): Path(f'/tmp/mixed-{i}.js').write_text(code,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/mixed-*.js; do node --check "$f"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Android Gradle Plugin signing
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CumleCalisma-Mixed-Installable-v5
          path: ${{ env.APK }}
          if-no-files-found: error
