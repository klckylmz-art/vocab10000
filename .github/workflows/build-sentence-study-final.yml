name: Build Sentence Study Final APK

on:
  push:
    branches:
      - build-sentence-study-apk-20260924
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore latest HTML
        shell: bash
        run: |
          cat apk_payload/part00 apk_payload/part01 apk_payload/part02 apk_payload/part03 apk_payload/part04 apk_payload/part05 apk_payload/part06 | base64 -d > /tmp/index.html.xz
          xz -t /tmp/index.html.xz
          xz -dc /tmp/index.html.xz > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q 'AndroidTTS' app/src/main/assets/index.html
          grep -q 'gapMs:4000' app/src/main/assets/index.html

      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SentenceStudyAPK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
