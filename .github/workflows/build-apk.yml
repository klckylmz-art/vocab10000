name: Build Cumle Calisma APK

on:
  push:
    branches: [ sentence-app-apk ]
    paths:
      - 'apk_src/**'
      - 'scripts/patch_voice_features.py'
      - '.github/workflows/build-apk.yml'
      - '.build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          cat apk_src/chunk*.txt > /tmp/cumle-project.b64
          base64 -d /tmp/cumle-project.b64 > /tmp/cumle-project.tar.xz
          mkdir -p buildsrc
          tar -xJf /tmp/cumle-project.tar.xz -C buildsrc --strip-components=1
          test -f buildsrc/settings.gradle
          test -f buildsrc/app/src/main/assets/index.html
          test -f buildsrc/app/src/main/java/net/ytutor/sentenceapp/PlaybackService.java

      - name: Patch WebView safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker="const $ = id => document.getElementById(id);"
          fallback='\n'.join([
              'if (!window.speechSynthesis) {',
              '  window.speechSynthesis = {',
              '    cancel(){},',
              '    getVoices(){ return []; },',
              "    speak(u){ try{ if(u && typeof u.onend==='function') setTimeout(()=>u.onend(),0); }catch(e){} },",
              '    onvoiceschanged:null',
              '  };',
              '}'
          ])
          if fallback not in s:
              s=s.replace(marker, marker+'\n'+fallback, 1)
          s=s.replace("autoAdvance.checked = localStorage.getItem('autoAdvance') === '1';", "autoAdvance.checked = localStorage.getItem('autoAdvance') !== '0';", 1)
          old_top='<button class="iconBtn" id="settingsBtn" aria-label="Ayarlar" title="Ayarlar">⚙</button>'
          s=s.replace(old_top,'<div aria-hidden="true"></div>',1)
          old_nav='<button id="grammarBtn" class="grammarBtn">Grammar</button>'
          new_nav=old_nav+'\n    <button id="settingsBtn">⚙ Ayarlar</button>'
          s=s.replace(old_nav,new_nav,1)
          s=s.replace('grid-template-columns:1fr 1.2fr 1fr 1fr;','grid-template-columns:repeat(5,1fr);',1)
          s=s.replace('.navinner{gap:7px;grid-template-columns:1fr 1fr}', '.navinner{gap:6px;grid-template-columns:repeat(5,1fr)}',1)
          s=s.replace('.nav button{padding:12px 7px;font-size:14px}', '.nav button{padding:11px 4px;font-size:12px;min-width:0}',1)
          anchor='\n'.join([
              "  document.addEventListener('visibilitychange',function(){",
              '    if(!document.hidden){',
              '      try{ __androidSyncPlayback(AndroidApp.playbackOrderPos(), AndroidApp.isPlaying()); }catch(e){}',
              '    }',
              '  });'
          ])
          block='\n'.join([
              '  function syncAndroidPlayback(){',
              '    if(document.hidden) return;',
              '    try{ __androidSyncPlayback(AndroidApp.playbackOrderPos(), AndroidApp.isPlaying()); }catch(e){}',
              '  }',
              '  setInterval(syncAndroidPlayback, 250);',
              ''
          ])
          if 'setInterval(syncAndroidPlayback, 250);' not in s:
              s=s.replace(anchor, block+anchor, 1)
          p.write_text(s,encoding='utf-8')
          assert 'if (!window.speechSynthesis)' in s
          assert s.count('id="settingsBtn"') == 1
          assert 'const DATA = [' in s
          assert 'function renderGrammar()' in s
          assert 'async function translateTerm(term)' in s
          assert 'setInterval(syncAndroidPlayback, 250);' in s
          print('HTML base patch verified')
          PY

      - name: Add voice preview favorites and hidden list
        run: python scripts/patch_voice_features.py

      - name: Verify JavaScript and voice controls
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('buildsrc/app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i,code in enumerate(scripts):
              Path(f'/tmp/script-{i}.js').write_text(code,encoding='utf-8')
          assert 'setInterval(syncAndroidPlayback, 250);' in s
          assert 'AndroidApp.playbackOrderPos()' in s
          assert 'id="trPreviewVoice"' in s
          assert 'id="enPreviewVoice"' in s
          assert 'ttsVoiceFavorites' in s
          assert 'ttsVoiceHidden' in s
          assert 'previewSelectedVoice' in s
          assert 'applySelectedVoice' in s
          print('scripts:',len(scripts),'voice controls and playback sync present')
          PY
          for f in /tmp/script-*.js; do node --check "$f"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CumleCalisma-APK-Fixed5
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
