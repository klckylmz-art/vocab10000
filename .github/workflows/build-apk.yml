name: Build Cumle Calisma APK

on:
  push:
    branches: [ sentence-app-apk ]
    paths:
      - 'apk_src/**'
      - '.github/workflows/build-apk.yml'
      - '.build-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          cat apk_src/chunk*.txt > /tmp/cumle-project.b64
          base64 -d /tmp/cumle-project.b64 > /tmp/cumle-project.tar.xz
          mkdir -p buildsrc
          tar -xJf /tmp/cumle-project.tar.xz -C buildsrc --strip-components=1
          test -f buildsrc/settings.gradle
          test -f buildsrc/app/src/main/assets/index.html
          test -f buildsrc/app/src/main/java/net/ytutor/sentenceapp/PlaybackService.java

      - name: Patch WebView compatibility and bottom settings button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')

          # Android WebView may not expose the browser SpeechSynthesis API.
          # Provide a harmless fallback so initial render and event binding never crash.
          marker="const $ = id => document.getElementById(id);"
          fallback="""const speechSynthesis = window.speechSynthesis || {\n  cancel(){},\n  getVoices(){ return []; },\n  speak(u){ try{ if(u && typeof u.onend==='function') setTimeout(()=>u.onend(),0); }catch(e){} },\n  onvoiceschanged:null\n};"""
          if fallback not in s:
              s=s.replace(marker, marker+'\\n'+fallback, 1)

          # Move Settings from the top bar to the fixed bottom navigation.
          old_top='<button class="iconBtn" id="settingsBtn" aria-label="Ayarlar" title="Ayarlar">⚙</button>'
          s=s.replace(old_top,'<div aria-hidden="true"></div>',1)
          old_nav='<button id="grammarBtn" class="grammarBtn">Grammar</button>'
          new_nav=old_nav+'\\n    <button id="settingsBtn">⚙ Ayarlar</button>'
          s=s.replace(old_nav,new_nav,1)

          # Five equal bottom controls; keep them tappable on narrow phones.
          s=s.replace('grid-template-columns:1fr 1.2fr 1fr 1fr;','grid-template-columns:repeat(5,1fr);',1)
          s=s.replace('@media(max-width:650px){','@media(max-width:650px){',1)
          s=s.replace('.navinner{gap:7px;grid-template-columns:1fr 1fr}', '.navinner{gap:6px;grid-template-columns:repeat(5,1fr)}',1)
          s=s.replace('.nav button{padding:12px 7px;font-size:14px}', '.nav button{padding:11px 4px;font-size:12px;min-width:0}',1)

          p.write_text(s,encoding='utf-8')

          # Verification of patch invariants.
          assert 'const speechSynthesis = window.speechSynthesis ||' in s
          assert s.count('id="settingsBtn"') == 1
          assert '<button id="settingsBtn">⚙ Ayarlar</button>' in s
          assert 'const DATA = [' in s
          assert 'function renderGrammar()' in s
          print('HTML patch verified')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CumleCalisma-APK-Fixed
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
